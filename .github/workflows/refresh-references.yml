name: Refresh skill references

# The generated reference files are derived from live Xweather catalogs, so they go stale whenever
# an endpoint, layer, filter, or multiplier changes. This checks weekly and opens a PR on drift.
on:
  schedule:
    - cron: "17 9 * * 1"     # Mondays 09:17 UTC
  workflow_dispatch:
  pull_request:
    # On PRs, only verify — never rewrite. Catches a hand-edit to a generated file.
    paths:
      - "plugins/xweather/skills/weather-api/references/**"
      - "plugins/xweather/skills/raster-maps/references/**"
      - "plugins/xweather/skills/mapsgl/references/**"
      - "scripts/regenerate_references.py"

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    # On a pull_request, fail if a generated file was hand-edited or the catalogs moved.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated references match the live catalogs
        run: python3 scripts/regenerate_references.py --check

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the plugin manifest
        run: |
          # Cheap guard: a malformed manifest should fail here, not after a PR is opened.
          python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Regenerate references
        id: regen
        run: |
          python3 scripts/regenerate_references.py | tee regen.log
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize
        run: |
          {
            echo "### Reference regeneration"
            echo
            if [ "${{ steps.regen.outputs.changed }}" = "true" ]; then
              echo "Drift found. Files updated:"
              echo
              echo '```'
              git diff --stat
              echo '```'
            else
              echo "No drift — references match the live Xweather catalogs."
            fi
            echo
            echo '<details><summary>Script output</summary>'
            echo
            echo '```'
            cat regen.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        if: steps.regen.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/refresh-references
          # Reuse one branch so repeated runs update the same PR instead of opening a pile of them.
          title: "chore: refresh skill references from Xweather catalogs"
          commit-message: |
            chore: refresh skill references from Xweather catalogs

            Regenerated by scripts/regenerate_references.py.
          body: |
            The Xweather catalogs have changed since these references were last generated.

            Regenerated by `scripts/regenerate_references.py` from:
            - `https://www.xweather.com/docs/api/weather-api/endpoints` plus each endpoint's doc page
            - `https://www.xweather.com/docs/api/maps/layers`
            - `https://www.xweather.com/docs/api/mapsgl/layers`

            **Review the diff before merging.** Two things worth a human eye:

            - A large deletion may mean the docs site changed shape rather than the product changing.
              The script refuses to write near-empty files, but it can't tell a real removal from a
              parsing regression.
            - `access-cost.md`, `map-units.md`, and the MapsGL `weather-layers.md` embed generated
              groupings inside hand-written prose, so the script only *reports* drift there. If the
              run log mentions any of them, edit it by hand in this PR.

            Consider bumping `version` in `.claude-plugin/plugin.json` before
            merging — installed plugins only update when that field changes.
          labels: |
            dependencies
            documentation
          delete-branch: false
